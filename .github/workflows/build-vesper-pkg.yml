name: Build Vesper PKG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag with macOS app tar.gz assets"
        required: true
        default: "dmg-build-1.0.60-beta.1"
      version:
        description: "Vesper Launcher version"
        required: true
        default: "1.0.60-beta.1"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-pkg:
    name: Build PKG (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-x64
          - osx-arm64

    steps:
      - name: Download app bundle archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}-app.tar.gz" \
            --dir work

      - name: Build PKG installer
        shell: bash
        run: |
          set -euo pipefail
          archive="work/VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}-app.tar.gz"
          extract_dir="work/extracted-${{ matrix.rid }}"
          root_dir="work/pkg-root-${{ matrix.rid }}"
          scripts_dir="work/pkg-scripts-${{ matrix.rid }}"
          component_pkg="work/VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}-component.pkg"
          final_pkg="VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}.pkg"
          app_path="$root_dir/Applications/Vesper Launcher.app"
          resources_dir="$app_path/Contents/Resources"
          plist_path="$app_path/Contents/Info.plist"

          mkdir -p "$extract_dir" "$root_dir/Applications" "$scripts_dir"
          tar -xzf "$archive" -C "$extract_dir"
          rm -rf "$root_dir/Applications/Vesper Launcher.app"
          cp -R "$extract_dir/Vesper Launcher.app" "$root_dir/Applications/"
          chmod +x "$app_path/Contents/MacOS/VesperLauncher"

          if [[ -f "$resources_dir/vesper-logo.png" ]]; then
            iconset="work/vesper.iconset"
            rm -rf "$iconset"
            mkdir -p "$iconset"
            sips -z 16 16     "$resources_dir/vesper-logo.png" --out "$iconset/icon_16x16.png" >/dev/null
            sips -z 32 32     "$resources_dir/vesper-logo.png" --out "$iconset/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     "$resources_dir/vesper-logo.png" --out "$iconset/icon_32x32.png" >/dev/null
            sips -z 64 64     "$resources_dir/vesper-logo.png" --out "$iconset/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   "$resources_dir/vesper-logo.png" --out "$iconset/icon_128x128.png" >/dev/null
            sips -z 256 256   "$resources_dir/vesper-logo.png" --out "$iconset/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   "$resources_dir/vesper-logo.png" --out "$iconset/icon_256x256.png" >/dev/null
            sips -z 512 512   "$resources_dir/vesper-logo.png" --out "$iconset/icon_256x256@2x.png" >/dev/null
            sips -z 512 512   "$resources_dir/vesper-logo.png" --out "$iconset/icon_512x512.png" >/dev/null
            sips -z 1024 1024 "$resources_dir/vesper-logo.png" --out "$iconset/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$iconset" -o "$resources_dir/vesper-app.icns"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$plist_path" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string vesper-app" "$plist_path"
          fi

          /usr/libexec/PlistBuddy -c "Delete :CFBundleName" "$plist_path" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Vesper Launcher" "$plist_path"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$plist_path" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Vesper Launcher" "$plist_path"
          /usr/libexec/PlistBuddy -c "Delete :CFBundlePackageType" "$plist_path" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$plist_path"

          cat > "$scripts_dir/preinstall" <<'SCRIPT'
          #!/bin/bash
          rm -rf "/Applications/Vesper Launcher.app" "/Applications/Vesper Launcher 2.app"
          exit 0
          SCRIPT
          chmod +x "$scripts_dir/preinstall"

          cat > "$scripts_dir/postinstall" <<'SCRIPT'
          #!/bin/bash
          chmod +x "/Applications/Vesper Launcher.app/Contents/MacOS/VesperLauncher" 2>/dev/null || true
          touch "/Applications/Vesper Launcher.app" 2>/dev/null || true
          exit 0
          SCRIPT
          chmod +x "$scripts_dir/postinstall"

          pkgbuild \
            --root "$root_dir" \
            --scripts "$scripts_dir" \
            --identifier "site.vesper.launcher" \
            --version "${{ inputs.version }}" \
            --install-location "/" \
            "$component_pkg"

          productbuild \
            --package "$component_pkg" \
            --identifier "site.vesper.launcher.installer" \
            --version "${{ inputs.version }}" \
            "$final_pkg"

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}-pkg
          path: VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}.pkg
          if-no-files-found: error

      - name: Upload PKG to release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "VesperLauncher-${{ inputs.version }}-${{ matrix.rid }}.pkg"